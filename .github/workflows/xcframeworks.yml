name: Dash xcframeworks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'ci/universal-frameworks-refresh'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Exercise build paths that contain spaces.
          path: source checkout
      - name: Build and audit XCFrameworks
        working-directory: source checkout
        run: |
          xcodebuild -version
          brew list ncurses >/dev/null 2>&1 || brew install ncurses
          PATH="$(brew --prefix ncurses)/bin:$PATH" bash build_dash.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframeworks
          include-hidden-files: true
          if-no-files-found: error
          path: |
            source checkout/.build/dash-xcframeworks/dist/*.xcframework.zip
            source checkout/.build/dash-xcframeworks/dist/checksums.txt
            source checkout/.build/dash-xcframeworks/dist/frameworks-audit.txt
